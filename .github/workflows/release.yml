name: Release

# Every merge to main is a new build and gets its own GitHub pre-release,
# tagged v<version>+build.<n> (e.g. v0.1.0-alpha.1+build.6). The build
# number counts merges to main. The version only changes when a pull
# request bumps it (see RELEASING.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the build number counts merges to main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: info
        run: node scripts/release.mjs info >> "$GITHUB_OUTPUT"

      - id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.existing.outputs.released == 'false'
        run: |
          npm ci
          npm run release:check
          npm test

      - if: steps.existing.outputs.released == 'false'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}

      - if: steps.existing.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.info.outputs.version }}
          BUILD: ${{ steps.info.outputs.build }}
          TAG: ${{ steps.info.outputs.tag }}
          PRERELEASE: ${{ steps.info.outputs.prerelease }}
        run: |
          # Notes: GitHub's list of pull requests merged since the previous
          # build, preceded by the changelog entry on a version's first build.
          {
            echo "**Version $VERSION, build $BUILD**"
            if [ -z "$(git tag -l "v$VERSION" "v$VERSION+build.*")" ]; then
              echo
              node scripts/release.mjs notes
            fi
          } > release-notes.md
          (cd dist && zip -qr "../central-$VERSION-build.$BUILD.zip" .)
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "central-$VERSION-build.$BUILD.zip" \
            --target "$GITHUB_SHA" \
            --title "Central v$VERSION · build $BUILD" \
            --notes-file release-notes.md \
            --generate-notes \
            "${flags[@]}"
