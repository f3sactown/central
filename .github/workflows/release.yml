name: Release

# Publishes a GitHub Release whenever main carries a version that has not
# been released yet. To release: bump the version and add a CHANGELOG entry
# in a pull request (see RELEASING.md); merging it publishes the release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: info
        run: node scripts/release.mjs info >> "$GITHUB_OUTPUT"

      - id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.existing.outputs.released == 'false'
        run: |
          npm ci
          npm run release:check
          npm test

      - if: steps.existing.outputs.released == 'false'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - if: steps.existing.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          PRERELEASE: ${{ steps.info.outputs.prerelease }}
        run: |
          node scripts/release.mjs notes > release-notes.md
          (cd dist && zip -qr "../central-$TAG.zip" .)
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "central-$TAG.zip" \
            --target "$GITHUB_SHA" \
            --title "Central $TAG" \
            --notes-file release-notes.md \
            "${flags[@]}"
